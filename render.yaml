services:
  - type: web
    name: restaurant-business-ai-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SALES_PROVIDER_ENABLED
        value: "false"
      - key: SALES_PROVIDER_NAME
        value: resend
      - key: SALES_EMAIL_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: SALES_B2B_OUTREACH_ENABLED
        value: "false"
      - key: RESEND_SENDING_DOMAIN
        sync: false
      - key: RESEND_DOMAIN_VERIFIED
        value: "false"
      - key: SALES_TEST_MODE
        value: "false"
      - key: SALES_TEST_RECIPIENT
        sync: false
      - key: SALES_TEST_TOKEN
        sync: false
      - key: CONTROL_PLANE_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: AUTONOMOUS_SALES_ENABLED
        value: "false"
      - key: AUTONOMOUS_DAILY_LIMIT
        value: "10"
      - key: AUTONOMOUS_REQUIRE_CONSENT
        value: "true"
      - key: AUTONOMY_CONTROL_TOKEN
        sync: false
      - key: AUTONOMY_HANDOFF_RECIPIENT
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: restaurant-business-ai-autonomous-worker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: node autonomous-worker.js
    schedule: "17 * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: AUTONOMOUS_SALES_ENABLED
        value: "false"
      - key: AUTONOMOUS_DAILY_LIMIT
        value: "10"
      - key: AUTONOMOUS_REQUIRE_CONSENT
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: AUTONOMY_HANDOFF_RECIPIENT
        sync: false
